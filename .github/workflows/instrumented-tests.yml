name: Instrumented tests

# Runs the on-device tests on Wear OS emulators. Heavier than the unit-test gate,
# so it is opt-in (manual + on PRs).
#
# What it is for: the two places a JVM test cannot reach - the Compose screens,
# which need a real composition, and the DataStore-backed record store, which
# needs a Context. The rules, the pacing and the geometry are plain Kotlin and are
# covered far more cheaply by the unit tests.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Without this, pushing twice to a pull request leaves two full emulator matrices
# running against each other for many minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The screen the game is designed for: a large round watch, which is
          # what the OnePlus Watch 2R it is built against is.
          - name: watch-round
            profile: wearos_large_round
            api-level: 34
          # The oldest platform the app supports. The layout maths is the same on
          # both, but the Compose and DataStore runtimes are not.
          - name: watch-round-min
            profile: wearos_small_round
            api-level: 30
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # KVM is what makes an x86 emulator usable on a runner; without it the
      # emulator falls back to software rendering and the job times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: ${{ matrix.api-level }}
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
